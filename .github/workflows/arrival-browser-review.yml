name: Arrival browser review
on:
  pull_request:
    paths:
      - 'public/mission-control/**'
      - 'scripts/arrival-browser-check.mjs'
      - 'scripts/guest-browser-check.mjs'
      - 'public/invites/**'
      - 'public/scout/**'
      - 'scripts/scout-browser-check.mjs'
      - '.github/workflows/arrival-browser-review.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - run: npx playwright install chromium --with-deps
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory public >/tmp/hns-http.log 2>&1 &
          node scripts/arrival-browser-check.mjs
          node scripts/guest-browser-check.mjs
          node scripts/scout-browser-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arrival-browser-review
          path: browser-review/
          retention-days: 7
