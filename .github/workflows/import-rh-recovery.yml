name: Restore verified recruitment sources
on:
  push:
    branches: [integration/unified-platform]
    paths: ['.github/workflows/import-rh-recovery.yml', 'recovery/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: unified-rh-import
  cancel-in-progress: false
jobs:
  import:
    if: github.ref == 'refs/heads/integration/unified-platform'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/unified-platform
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recover exact source bytes and public assets
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,pathlib,zlib,urllib.request,subprocess
          def unpack(name,expected):
              raw=zlib.decompress(base64.b64decode(pathlib.Path('recovery/'+name).read_text().strip(),validate=True))
              assert hashlib.sha256(raw).hexdigest()==expected, name+' checksum mismatch'
              return raw
          server=unpack('rh-server.zlib.b64','b901625d5f6c789eafacacf466f9b7a9c7c3bf3372edbec61697fbfb9163c1a7')
          tests=unpack('rh-tests.zlib.b64','c36ce9c0f6cc768aa602b72f28b305e10b0afa9f062db601542b68bbabac026f')
          diff=unpack('rh-ui.patch.zlib.b64','59337e69c92eef6d35004cea75eba34182d68c76f37c32cb9afd4c788e144a36')
          allowed={'netlify/functions/_cv.mjs','netlify/functions/_utils.mjs','netlify/functions/candidate-cv.mjs','netlify/functions/candidates-admin.mjs','netlify/functions/on-candidate.mjs','netlify/functions/triage.mjs','tests/recruitment-admin-api.test.mjs','tests/recruitment-cv.test.mjs','tests/recruitment-triage.test.mjs','tests/recruitment-unified-contract.test.mjs','tests/recruitment-utils.test.mjs'}
          files=json.loads(server)|json.loads(tests)
          assert set(files)==allowed
          for name,content in files.items():
              p=pathlib.Path(name);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(content.encode('utf-8'))
          manifest="""__forms.html df48dd242e0b99741af024517afb72959e6479f64c3f023bd2a7db421bf86c2b
          admin-recrutement.html bc2746e20961fc9a630db861a7f5dff3f9ec1fab56dd119eecd79bbb9b3a5c67
          admin.css b7b293d16ec49532162b9d6d98553a8913e5601f3bd742fd47fd8271d4477be8
          admin.js 8635ec342be09c13c582e96fef65878dd2cb03030ad2235458c274312f453836
          app.js 44aded1483fd214df88e18ed721d9464abb94e5afd089dfc5308c243009b3dc6
          assets/favicon.svg fc7792c98018bc3faa50f81a0de138bf0746398ff4b5d1ef1c38975ee2de6785
          assets/hero-sculpture-blue.webp 9f398ad118ece4b1295ce58710d649eb59e9e99738ffa33a1f25b87bcc1a28b1
          assets/hero-sculpture.webp f1721afa3ac161ad625918339360f0a2001e23cab8585285f806fe47537fb355
          assets/hns-group-favicon.png d50b42a2d20220be0c984988a136d0c6540e14e617e373b6277c92d6e3f055d5
          assets/hns-group-logo.png d50b42a2d20220be0c984988a136d0c6540e14e617e373b6277c92d6e3f055d5
          assets/hns-group-original.jpeg b8ea5230816903326cf9ef1d6ed92e1d4f611cf70013c4233f169dc4f020dc90
          assets/ismael.webp 601a787399b941e86c9bf101efeec4a4b33fa71682b7f065e2ac22d52063bb80
          confidentialite.html 11f93d8e2cf39423a77ed7f0b9d07dd3f6d0297c89aba3b42f9bb2fccf32a798
          config.js 419fb238847ea4be457b2723267fd8379c4627ed2660a857791df4dc6fff17a3
          index.html 7f164b5389fd55bb8c9fbcc24a1c78bfcd572c6f468a0ecdf33f7767de04c790
          merci.html ee88f6c5dd33322e69d8b7dac00b8e662e8ea88d33601a8d135cd8432dce5db5
          styles.css 19c38ad9dd6cc80ff346a6a3ed2fa379d0d89f46c12a144ea228dc1cb414db1f"""
          roots=['https://6af2529e0ab21479671527f5--ai-hns-hackathon.netlify.app/','https://ai.hns.ma/']
          for line in manifest.splitlines():
              name,digest=line.split()
              paths=[name]
              if name=='index.html':paths.append('')
              elif name.endswith('.html'):paths.append(name[:-5])
              data=None
              for root in roots:
                  for urlpath in paths:
                      try:
                          with urllib.request.urlopen(urllib.request.Request(root+urlpath,headers={'User-Agent':'HNS-source-recovery/1.0','Accept-Encoding':'identity'}),timeout=20) as response:
                              raw=response.read(2000000)
                          if hashlib.sha256(raw).hexdigest()==digest:
                              data=raw;break
                      except Exception:pass
                  if data is not None:break
              assert data is not None,'No checksum-matching public file: '+name
              p=pathlib.Path('public')/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
              print('Verified',name,flush=True)
          subprocess.run(['git','apply','--unidiff-zero','-'],input=diff,check=True)
          for name,digest in {'admin.css':'68eaa3b7aee81bcd85056558b787b1ed92a4c89eb27cdff98fc6d5a8ce137b24','admin.js':'0a8667f5255f1e491eb4c4bcf4cdd05a5f2cc2b66fb3771b3d984ff53f8ebd21','index.html':'81af7bcf3f40997836ef718276941f31c4153eb02005dffe3465831ad8a031bc'}.items():
              assert hashlib.sha256((pathlib.Path('public')/name).read_bytes()).hexdigest()==digest,name
          print('All 28 recovered files verified')
          PY
      - name: Install and validate
        run: |
          npm install --no-audit --no-fund
          npm run verify
          node --check public/admin.js
          node --check public/app.js
          for f in netlify/functions/*.mjs; do node --check "$f"; done
      - name: Commit restored sources on integration branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public netlify/functions tests
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Restore checksum-verified recruitment sources and connect Mission Control"
          git push origin HEAD:integration/unified-platform
