[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/mission"
  to = "/.netlify/functions/mission"
  status = 200

[[redirects]]
  from = "/favicon.ico"
  to = "/assets/hns-group-favicon.png"
  status = 302

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/__forms.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/admin-recrutement"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "private, no-store"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/admin-recrutement.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "private, no-store"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/mission-control/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/invitation-confirm/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/invites/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
    Referrer-Policy = "no-referrer"
    Cache-Control = "private, no-store"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Robots-Tag = "noindex, nofollow"

# Redeploy production to apply rotated staff access credentials (2026-11-25).

[[headers]]
  for = "/scout/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
    Referrer-Policy = "no-referrer"
    Cache-Control = "private, no-store"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
    X-Robots-Tag = "noindex, nofollow"
